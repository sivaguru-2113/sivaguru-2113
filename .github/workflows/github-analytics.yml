name: Update GitHub Analytics

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/github-analytics.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile analytics cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          EXCLUDE: ''
          AUTO_PUSH: true
          THEME: github_dark
          ANIMATION: load
          DURATION: '2.5'
          NAME: 'SIVAGURU P · JOYBOY'
