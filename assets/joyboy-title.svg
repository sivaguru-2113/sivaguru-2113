<svg xmlns="http://www.w3.org/2000/svg" width="850" height="72" viewBox="0 0 850 72" role="img" aria-labelledby="title desc">
  <title id="title">HI, I'M SIVAGURU P · JOYBOY</title>
  <desc id="desc">A subtle continuous ghost-glow animation for the profile title.</desc>
  <defs>
    <filter id="softGlow" x="-20%" y="-70%" width="140%" height="240%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="wideGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="30" font-weight="700" letter-spacing="0.5">
    <!-- Wide, faint aura -->
    <text x="425" y="47" fill="#F2F2F2" opacity="0.06" filter="url(#wideGlow)">
      HI, I'M SIVAGURU P · JOYBOY
      <animate attributeName="opacity" values="0.025;0.10;0.025" dur="4.8s" repeatCount="indefinite"/>
    </text>

    <!-- Ghost afterimages gently drift around the stable title -->
    <text x="425" y="47" fill="#F2F2F2" opacity="0.12" filter="url(#softGlow)">
      HI, I'M SIVAGURU P · JOYBOY
      <animateTransform attributeName="transform" type="translate" values="-5 0;5 0;-5 0" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.15;0.03" dur="4.2s" repeatCount="indefinite"/>
    </text>
    <text x="425" y="47" fill="#F2F2F2" opacity="0.10" filter="url(#softGlow)">
      HI, I'M SIVAGURU P · JOYBOY
      <animateTransform attributeName="transform" type="translate" values="5 0;-5 0;5 0" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.02;0.12;0.02" dur="4.2s" begin="-2.1s" repeatCount="indefinite"/>
    </text>

    <!-- Crisp identity layer stays permanently present -->
    <text x="425" y="47" fill="#F2F2F2">
      HI, I'M SIVAGURU P · JOYBOY
    </text>
  </g>
</svg>
